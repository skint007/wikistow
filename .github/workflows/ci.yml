# Checks every pull request and every push to main, on GitHub-hosted runners.
# A push to main also publishes the server image, tagged with its commit. The
# release workflow runs this one for a release tag, so the image and desktop
# app it publishes come from the same tested build (docs/releasing.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # By hand on any branch (Actions → CI → Run workflow), which also builds
  # and checks the desktop packages, as a push to main does.
  workflow_dispatch:
  workflow_call:
    inputs:
      latest:
        description: Tag the image `latest` too, for the newest stable release.
        type: boolean
        default: false
      beta:
        description: Tag the image `beta` too, for the newest release from main, beta or stable.
        type: boolean
        default: false

# Every job only reads, except the image job, which pushes to GHCR. Pull
# requests, forks' included, never reach it.
permissions:
  contents: read

# A pull request's newer push replaces its older run. Every other run has a
# group of its own, so each main commit finishes and gets its image.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  POSTGRES_ADMIN_URL: postgres://wikistow:wikistow@postgres:5432/postgres

jobs:
  # Format, lint, and type checks, one version everywhere, and its changelog
  # entry (docs/releasing.md#the-changelog).
  check:
    runs-on: ubuntu-24.04
    # Both images are glibc, so the same lockfile installs the native binaries
    # Vite+ ships (Rolldown, Oxc, tsgolint) in each.
    container: &node_image node:26-trixie-slim@sha256:ec7758ee051e457b468b32bde57b0879010b325bb9862718e9615225ce4aaae1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: ./node_modules/.bin/vp check
      - run: node scripts/version.ts
      - run: node scripts/changelog.ts

  test:
    runs-on: ubuntu-24.04
    container: *node_image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: ./node_modules/.bin/vp test --project client --project unit

  # Against the Postgres service; each test file clones its own database.
  # The CLI's suite builds its bundle into a directory of its own and runs it there.
  # The restore drill runs scripts/backup.sh and restore.sh, which need the
  # Postgres client at the service's major version; trixie's is 17.
  test-integration:
    runs-on: ubuntu-24.04
    container: *node_image
    services:
      postgres: &postgres
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: wikistow
          POSTGRES_PASSWORD: wikistow
          POSTGRES_DB: wikistow
        options: >-
          --health-cmd "pg_isready -U wikistow" --health-interval 2s --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client-17
      - run: ./node_modules/.bin/vp test --project integration
        env:
          TEST_DATABASE_URL: ${{ env.POSTGRES_ADMIN_URL }}

  # The protocol vectors again, in real Chromium, so browser and Node must
  # agree; and the editor surfaces, mounted for real.
  test-browser:
    runs-on: ubuntu-24.04
    # Keep in step with the playwright devDependency so the bundled Chromium revision matches.
    container: &browser_image mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: ./node_modules/.bin/vp test --project client-browser --project ui-browser

  # Everything that ships, built once: the later jobs test these files, and
  # the image and the release publish them. A release tag's build shows its
  # version alone (apps/web/vite.config.ts). The web build regenerates the
  # committed route tree; it must not change.
  build:
    runs-on: ubuntu-24.04
    container: *node_image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The web clipper's helper, for every package's system, from here
      # (apps/desktop/scripts/clip-host.sh). Go fetches its modules over TLS,
      # which the slim image has no certificates for.
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates >/dev/null
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop/clip-host/go.mod
          cache-dependency-path: apps/desktop/clip-host/go.sum
      # The search model the web build fetches from Hugging Face and checks
      # against its pinned hashes, and its Brotli copies, which take a minute
      # to make (apps/web/meaning.ts). Kept by hash, so a stale entry is
      # never used.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/wikistow-meaning
          key: meaning-${{ hashFiles('packages/ui/src/meaning/model.ts', 'pnpm-lock.yaml') }}
          restore-keys: meaning-
      - run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export WIKISTOW_RELEASE="${GITHUB_REF_NAME#v}"; fi
          cp packages/ui/src/routeTree.gen.ts "$RUNNER_TEMP/routeTree.committed.ts"
          ./node_modules/.bin/vp -C apps/server pack
          ./node_modules/.bin/vp -C apps/cli pack
          ./node_modules/.bin/vp -C apps/web build
          ./node_modules/.bin/vp -C apps/desktop pack
          # What the desktop release ships: the bundles and pages in one app.asar,
          # and the helper beside it.
          node apps/desktop/scripts/asar.ts
          (cd apps/desktop && scripts/clip-host.sh)
          cmp packages/ui/src/routeTree.gen.ts "$RUNNER_TEMP/routeTree.committed.ts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            apps/server/dist
            apps/cli/dist
            apps/web/dist
            apps/desktop/dist
            apps/desktop/out
          if-no-files-found: error
          retention-days: 7

  # The web clipper's helper on each system it ships for, against a fake
  # app: on Windows over a named pipe, read and written at once, with its
  # owner checked; on a Mac with LOCAL_PEERCRED (docs/adr/0017-web-clipper.md).
  # The race detector needs a C compiler, which only Linux is sure to have.
  clip-host:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-15]
    name: clip-host (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop/clip-host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop/clip-host/go.mod
          cache-dependency-path: apps/desktop/clip-host/go.sum
      # Once: Windows checks files out with CRLF endings, which gofmt reports.
      - if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 -timeout 3m $([ "$RUNNER_OS" = Linux ] && echo -race) ./...

  # Boot the exact bundles the image ships against a fresh database. They run
  # from a copy laid out like the image, outside the workspace, so a dependency
  # missing from the bundle can't be found in node_modules by accident.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    container: *node_image
    services:
      postgres: *postgres
    env:
      DATABASE_URL: postgres://wikistow:wikistow@postgres:5432/wikistow
      PUBLIC_ORIGIN: http://localhost:3000
      MIGRATIONS_DIR: /tmp/app/drizzle
      BLOB_DIR: /tmp/blobs
      WEB_DIST: /tmp/app/web
      # Placeholders: the smoke test sends no mail and signs nobody in.
      BETTER_AUTH_SECRET: smoke-test-secret-that-is-longer-than-32-characters
      SMTP_URL: smtp://127.0.0.1:1
      SMTP_FROM: WikiStow <smoke@localhost>
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          # The artifact's root is apps/, the folder its paths share.
          path: apps
      - name: Server
        run: |
          mkdir -p /tmp/app && cp -r apps/server/dist/. /tmp/app/ && cp -r packages/server/drizzle /tmp/app/drizzle && cp -r apps/web/dist /tmp/app/web
          cd /tmp/app
          for attempt in $(seq 1 30); do node migrate.mjs && break; [ "$attempt" -eq 30 ] && exit 1; sleep 1; done
          node server.mjs & server_pid=$!
          node -e "const go = async (n) => { try { const r = await fetch('http://127.0.0.1:3000/api/installation'); if (!r.ok) throw new Error(String(r.status)); console.log(await r.text()); } catch (e) { if (n === 0) throw e; await new Promise((s) => setTimeout(s, 500)); return go(n - 1); } }; go(20);"
          node -e "fetch('http://127.0.0.1:3000/sign-in').then(async (r) => { const csp = r.headers.get('content-security-policy') ?? ''; if (!r.ok || !csp.includes(\"script-src 'self'\") || !(await r.text()).includes('/boot.js')) process.exit(1); })"
          kill "$server_pid"
      # The CLI is one file too, and runs with nothing but Node: unenrolled,
      # it says so with its own exit status.
      - name: CLI
        run: |
          mkdir -p /tmp/cli/home && cp apps/cli/dist/wikistow.mjs /tmp/cli/
          cd /tmp/cli && node wikistow.mjs --help >/dev/null
          code=0; HOME=/tmp/cli/home node wikistow.mjs spaces list --json || code=$?; test "$code" -eq 5
          # Only the tests' own build may run a secret-tool root didn't install.
          grep -q 'Refusing to run' wikistow.mjs && ! grep -q WIKISTOW_TEST wikistow.mjs

  # The browser tests: the built app on the real server, in Chromium.
  e2e:
    needs: build
    runs-on: ubuntu-24.04
    container: *browser_image
    services:
      postgres: *postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: apps
      - run: ./node_modules/.bin/playwright test
        working-directory: apps/web
        env:
          TEST_DATABASE_URL: ${{ env.POSTGRES_ADMIN_URL }}
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: apps/web/test-results
          retention-days: 7

  # The desktop app on the same built pages, under a virtual display, with
  # GNOME Keyring as its secret store. The browser half of each sign-in runs
  # in Chromium beside it.
  e2e-desktop:
    needs: build
    runs-on: ubuntu-24.04
    container: *browser_image
    services:
      postgres: *postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: apps
      - run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gnome-keyring dbus-x11 >/dev/null
      # The clipper's test starts the helper from the build, whose artifact keeps no modes.
      - run: chmod 755 apps/desktop/out/clip-host/linux-amd64/wikistow-clip-host
      - run: ./e2e/with-keyring.sh xvfb-run -a -s '-screen 0 1600x1000x24' ./node_modules/.bin/playwright test
        working-directory: apps/desktop
        env:
          TEST_DATABASE_URL: ${{ env.POSTGRES_ADMIN_URL }}
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-desktop-results
          path: apps/desktop/test-results
          retention-days: 7

  # The .deb and .rpm: the tested app.asar on the Electron the desktop tests
  # ran, packaged by nfpm. Not for pull requests, to spare them the time, so
  # main shows a packaging break before a release tag does.
  linux-packages:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container: *node_image
    env:
      NFPM_VERSION: 2.47.0
      NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
    steps:
      # git first, so the checkout has the commit's time.
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl git >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: apps
      - run: |
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 30 -o /tmp/nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  /tmp/nfpm.tar.gz" | sha256sum -c
          tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
      # The commit's time for the files', as the release archive has. The
      # runner, not root, owns the checkout, which git refuses without this.
      - working-directory: apps/desktop
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          time=$(git log -1 --format=%ct)
          version=$(node ../../scripts/version.ts)
          SOURCE_DATE_EPOCH=$time scripts/linux-packages.sh "$version" out/linux-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: apps/desktop/out/linux-packages
          if-no-files-found: error
          retention-days: 7

  # The Mac app, one per kind of Mac, each built and started on its own: the
  # tested app.asar in Electron's darwin build, signed ad hoc
  # (scripts/macos-app.sh). The check starts the app it zipped, with no
  # server: its pages, menu bar, Keychain and window buttons.
  macos-app:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    name: macos-app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Only the desktop app's dependencies: Electron, for its checksums,
      # and Playwright.
      - run: |
          npm install -g "$(node -p "require('./package.json').packageManager")"
          pnpm install --frozen-lockfile --filter @wikistow/desktop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: apps
      - working-directory: apps/desktop
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          scripts/macos-app.sh "$(node ../../scripts/version.ts)" "$ARCH" out/macos
          for file in WikiStow wikistow-clip-host; do
            [ "$(lipo -archs "out/macos/WikiStow.app/Contents/MacOS/$file")" = "$(echo "$ARCH" | sed s/x64/x86_64/)" ]
          done
      - working-directory: apps/desktop
        run: MAC_APP="$PWD/out/macos/WikiStow.app" ./node_modules/.bin/playwright test
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-results-${{ matrix.arch }}
          path: apps/desktop/test-results
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app-${{ matrix.arch }}
          path: apps/desktop/out/macos/*.zip
          if-no-files-found: error
          retention-days: 7

  # Each supported distribution installs the packages, and every library
  # and symbol Electron links against must resolve. It doesn't start the app.
  linux-packages-check:
    needs: linux-packages
    runs-on: ubuntu-24.04
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        # Pinned like the other images. apt and dnf still install each
        # distribution's current packages.
        image:
          - debian:13@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
          - ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          - ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
          - fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
          - fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: packages
      - run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./packages/*.deb >/dev/null
            source=deb
          else
            dnf install -y -q ./packages/*.rpm
            source=rpm
          fi
          [ "$(cat /usr/lib/wikistow-desktop/install-source)" = "$source" ]
          # The clipper's helper runs, and with no app running answers for it.
          printf '\037\000\000\000{"v":1,"id":"a","type":"hello"}' |
            /usr/lib/wikistow-desktop/wikistow-clip-host | tail -c +5 | grep -F '"app":"closed"'
          for file in /usr/lib/wikistow-desktop/wikistow-desktop /usr/lib/wikistow-desktop/*.so*; do
            ldd -r "$file" 2>&1
          done | grep -E 'not found|undefined symbol' && exit 1
          echo 'Every library and symbol resolves.'

  # The Windows installers, x64 and arm64: the tested app.asar in Electron's
  # Windows build of the same version, packaged by NSIS. Built on Linux, as
  # the app has no native modules; each architecture in its own job, since
  # compressing one takes a few minutes. Not for pull requests, as the Linux
  # packages aren't.
  windows-packages:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container: *node_image
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends nsis >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: apps
      - working-directory: apps/desktop
        run: scripts/windows-packages.sh "$(node ../../scripts/version.ts)" out/windows-packages ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package-${{ matrix.arch }}
          path: apps/desktop/out/windows-packages
          if-no-files-found: error
          retention-days: 7

  # Each installer on Windows of its architecture: it installs, the app opens
  # its sign-in page and trusts DPAPI, and the uninstaller removes it all.
  windows-packages-check:
    needs: windows-packages
    runs-on: ${{ matrix.runner }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2025 }
          - { arch: arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .node-version
            apps/desktop/scripts/windows-check.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-package-${{ matrix.arch }}
          path: installer
      - shell: bash
        run: node apps/desktop/scripts/windows-check.ts installer/wikistow-desktop-*-${{ matrix.arch }}-setup.exe

  # The one check branch protection needs. A job skipped because another
  # failed would count as passing, so this one runs regardless and looks.
  passed:
    name: CI passed
    if: always()
    needs:
      [
        check,
        test,
        test-integration,
        test-browser,
        clip-host,
        build,
        smoke,
        e2e,
        e2e-desktop,
        macos-app,
      ]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done

  # The server image, from the tested build, on a push to main or a release
  # tag. A main push is tagged `sha-` and the commit's first 8 characters,
  # which never moves, and `main`, which moves to the newest main build; a
  # release with its version, and `beta` for any release from main
  # (docs/releasing.md). It
  # waits for the desktop packages too, so a release that can't ship them
  # publishes nothing.
  image:
    needs: [passed, linux-packages-check, windows-packages-check]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: apps
      # The version the account menu shows, for the image's labels.
      - id: version
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_TYPE" != tag ]; then version="$version+${GITHUB_SHA::8}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ steps.version.outputs.commit }},enable=${{ github.ref_type == 'branch' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ inputs.latest == true }}
            type=raw,value=beta,enable=${{ inputs.beta == true }}
          labels: |
            org.opencontainers.image.title=WikiStow
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          annotations: |
            org.opencontainers.image.title=WikiStow
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

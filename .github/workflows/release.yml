# A release: push a tag `v<version>` on a commit of main (docs/releasing.md).
# This checks the tag names the version in the source, runs CI on that
# commit, which publishes the server image under the version, and publishes
# the desktop app from the same build as a GitHub Release, then to the AUR.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.branch.outputs.latest }}
      time: ${{ steps.version.outputs.time }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Every package carries the version, and it is the tag's.
      - id: version
        run: |
          version=$(node scripts/version.ts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but the source says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The commit's time, which the release files carry.
          echo "time=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      # Only reviewed commits: main's, or a release/ branch's for a fix to
      # an older release. Only a stable release from main becomes `latest`.
      - id: branch
        run: |
          branches=$(git branch -r --contains "$GITHUB_SHA")
          if ! grep -Eq '^ *origin/(main|release/.+)$' <<< "$branches"; then
            echo "::error::$GITHUB_SHA is on neither main nor a release/ branch"
            exit 1
          fi
          latest=false
          if grep -Eq '^ *origin/main$' <<< "$branches" && [[ "$GITHUB_REF_NAME" != *-* ]]; then latest=true; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      # The .deb and .rpm bundle this Electron, so it must be its major's
      # newest patch, with every security fix released so far.
      - run: |
          pinned=$(jq -r .devDependencies.electron apps/desktop/package.json)
          newest=$(npm view "electron@${pinned%%.*}" version --json | jq -r 'if type == "array" then .[-1] else . end')
          if [ "$pinned" != "$newest" ]; then
            echo "::error::apps/desktop/package.json pins Electron $pinned, but $newest is out (docs/releasing.md)"
            exit 1
          fi

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      latest: ${{ needs.verify.outputs.latest == 'true' }}
    permissions:
      contents: read
      packages: write

  # The .deb and .rpm: the tested app.asar on the Electron the desktop tests
  # ran, packaged by nfpm. A job of its own, since installing dependencies
  # runs their code, which the job that publishes shouldn't.
  linux-packages:
    needs: [verify, ci]
    runs-on: ubuntu-24.04
    container: node:26-trixie-slim@sha256:ec7758ee051e457b468b32bde57b0879010b325bb9862718e9615225ce4aaae1
    permissions:
      contents: read
    env:
      NFPM_VERSION: 2.47.0
      NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: apps
      - run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
          curl -fsSLo /tmp/nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  /tmp/nfpm.tar.gz" | sha256sum -c
          tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
      - working-directory: apps/desktop
        env:
          SOURCE_DATE_EPOCH: ${{ needs.verify.outputs.time }}
        run: scripts/linux-packages.sh "${GITHUB_REF_NAME#v}" out/linux-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: apps/desktop/out/linux-packages
          if-no-files-found: error
          retention-days: 7

  # Each supported distribution installs the packages, and every library
  # and symbol Electron links against must resolve. It doesn't start the app.
  linux-packages-check:
    needs: linux-packages
    runs-on: ubuntu-24.04
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        # Tags, not digests, to check each distribution as its users have it.
        image: ['debian:13', 'ubuntu:24.04', 'ubuntu:26.04', 'fedora:43', 'fedora:44']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: packages
      - run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./packages/*.deb >/dev/null
            source=deb
          else
            dnf install -y -q ./packages/*.rpm
            source=rpm
          fi
          [ "$(cat /usr/lib/wikistow-desktop/install-source)" = "$source" ]
          for file in /usr/lib/wikistow-desktop/wikistow-desktop /usr/lib/wikistow-desktop/*.so*; do
            ldd -r "$file" 2>&1
          done | grep -E 'not found|undefined symbol' && exit 1
          echo 'Every library and symbol resolves.'

  # The desktop app as CI built and tested it: the .deb, the .rpm, and an
  # archive of what the AUR package installs, with checksums.
  desktop:
    needs: [verify, ci, linux-packages, linux-packages-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          # The artifact's root is apps/, the folder its paths share.
          path: apps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: release
      # The same bytes from the same commit: fixed order, owners and times.
      - env:
          TIME: ${{ needs.verify.outputs.time }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="wikistow-desktop-$version"
          mkdir -p "release/$name"
          cp apps/desktop/out/app.asar LICENSE "release/$name/"
          cp apps/desktop/packaging/wikistow-desktop apps/desktop/packaging/wikistow-desktop.desktop \
            apps/desktop/packaging/wikistow-desktop.png apps/desktop/packaging/wikistow-desktop.svg \
            "release/$name/"
          cd release
          tar --sort=name --owner=0 --group=0 --numeric-owner --mode=u+w,go-w \
            --mtime="@$TIME" -cf - "$name" | gzip -n > "$name.tar.gz"
          sha256sum "$name.tar.gz" wikistow-desktop-*.deb wikistow-desktop-*.rpm > SHA256SUMS
          cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # GitHub would otherwise make any stable release its latest, even
          # a fix to an older one.
          LATEST: ${{ needs.verify.outputs.latest }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "WikiStow ${GITHUB_REF_NAME#v}" "${prerelease[@]}" --latest="$LATEST" \
            release/*.tar.gz release/*.deb release/*.rpm release/SHA256SUMS

  # The AUR package follows the newest stable release, once its archive is
  # downloadable. A prerelease or a fix to an older line leaves it alone.
  aur:
    needs: [verify, desktop]
    if: needs.verify.outputs.latest == 'true'
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ needs.verify.outputs.version }}
    # The called job's environment alone leaves its secrets empty
    # (actions/runner#4453). The repository has no other secrets.
    secrets: inherit
    permissions:
      contents: read

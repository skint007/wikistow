# A release: push a tag `v<version>` on a commit of main (docs/releasing.md).
# This checks the tag names the version in the source, runs CI on that
# commit, which publishes the server image under the version, and publishes
# the desktop app and the CLI from the same build as a GitHub Release, with
# the notes from its CHANGELOG.md entry, then to the AUR.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.branch.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Every package carries the version, and it is the tag's.
      - id: version
        run: |
          version=$(node scripts/version.ts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but the source says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Every release in this history has its notes, this one too, dated the
      # day its tag was made. Publishing uses them.
      - run: node scripts/changelog.ts --tags
      # Only reviewed commits: main's, or a release/ branch's for a fix to
      # an older release. Only a stable release from main becomes `latest`.
      - id: branch
        run: |
          branches=$(git branch -r --contains "$GITHUB_SHA")
          if ! grep -Eq '^ *origin/(main|release/.+)$' <<< "$branches"; then
            echo "::error::$GITHUB_SHA is on neither main nor a release/ branch"
            exit 1
          fi
          latest=false
          if grep -Eq '^ *origin/main$' <<< "$branches" && [[ "$GITHUB_REF_NAME" != *-* ]]; then latest=true; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      # The .deb and .rpm bundle this Electron, so it must be its major's
      # newest patch, with every security fix released so far.
      - run: |
          pinned=$(jq -r .devDependencies.electron apps/desktop/package.json)
          newest=$(npm view "electron@${pinned%%.*}" version --json | jq -r 'if type == "array" then .[-1] else . end')
          if [ "$pinned" != "$newest" ]; then
            echo "::error::apps/desktop/package.json pins Electron $pinned, but $newest is out (docs/releasing.md)"
            exit 1
          fi

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      latest: ${{ needs.verify.outputs.latest == 'true' }}
    permissions:
      contents: read
      packages: write

  # The desktop app as CI built, tested and packaged it: the .deb, the .rpm,
  # and an archive of what its AUR package installs. Beside them, the CLI as
  # a binary for each system, its install scripts, its bundle for Node, and
  # checksums for every file.
  github-release:
    needs: [verify, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          # The artifact's root is apps/, the folder its paths share.
          path: apps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: release
      # The same bytes from the same commit: fixed order, owners and times.
      - run: |
          version="${GITHUB_REF_NAME#v}"
          name="wikistow-desktop-$version"
          mkdir -p "release/$name"
          cp apps/desktop/out/app.asar LICENSE "release/$name/"
          cp apps/desktop/packaging/wikistow-desktop apps/desktop/packaging/wikistow-desktop.desktop \
            apps/desktop/packaging/wikistow-desktop.png apps/desktop/packaging/wikistow-desktop.svg \
            "release/$name/"
          cd release
          tar --sort=name --owner=0 --group=0 --numeric-owner --mode=u+w,go-w \
            --mtime="@$(git log -1 --format=%ct)" -cf - "$name" | gzip -n > "$name.tar.gz"
      # The CLI as one binary per system, built by the Bun pinned here from
      # the bundle CI tested, beside its install scripts. The Linux x64 one
      # must run outside the workspace and say it is this release.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - working-directory: apps/cli
        run: scripts/binaries.sh "${GITHUB_REF_NAME#v}" ../../release
      # The bundle too, for Node.js on systems without a binary, packed the
      # same way. Unpacked away from the workspace, it runs with nothing but
      # Node and says it is this release.
      - run: |
          version="${GITHUB_REF_NAME#v}"
          name="wikistow-cli-$version"
          mkdir -p "release/$name"
          cp apps/cli/dist/wikistow.mjs apps/cli/packaging/wikistow LICENSE "release/$name/"
          cd release
          tar --sort=name --owner=0 --group=0 --numeric-owner --mode=u+w,go-w \
            --mtime="@$(git log -1 --format=%ct)" -cf - "$name" | gzip -n > "$name.tar.gz"
          tar -xzf "$name.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/$name"
          [ "$(node wikistow.mjs --version)" = "wikistow $version" ]
          node wikistow.mjs --help >/dev/null
      - working-directory: release
        run: |
          sha256sum wikistow-desktop-*.tar.gz wikistow-desktop-*.deb wikistow-desktop-*.rpm \
            wikistow-linux-* wikistow-darwin-* wikistow-windows-* install.sh install.ps1 \
            wikistow-cli-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      # The notes are the release's entry in CHANGELOG.md, reviewed in its
      # version change. Without one, nothing is published.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # GitHub would otherwise make any stable release its latest, even
          # a fix to an older one.
          LATEST: ${{ needs.verify.outputs.latest }}
        run: |
          node scripts/changelog.ts notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" \
            --title "WikiStow ${GITHUB_REF_NAME#v}" "${prerelease[@]}" --latest="$LATEST" \
            release/*.tar.gz release/*.deb release/*.rpm release/wikistow-linux-* release/wikistow-darwin-* \
            release/wikistow-windows-* release/install.sh release/install.ps1 release/SHA256SUMS

  # The AUR packages follow the newest stable release, once their archives
  # are downloadable. A prerelease or a fix to an older line leaves them alone.
  aur:
    needs: [verify, github-release]
    if: needs.verify.outputs.latest == 'true'
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ needs.verify.outputs.version }}
    # The called job's environment alone leaves its secrets empty
    # (actions/runner#4453). The repository has no other secrets.
    secrets: inherit
    permissions:
      contents: read

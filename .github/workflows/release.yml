# A release: push a tag `v<version>` on a commit of main (docs/releasing.md).
# This checks the tag names the version in the source, runs CI on that
# commit, which publishes the server image under the version, and publishes
# the desktop app and the CLI from the same build as a GitHub Release, with
# the notes from its CHANGELOG.md entry, then to the AUR, the Homebrew tap
# and the apt and dnf repositories. The browser extension's builds, and its
# source for Mozilla Add-ons, go in the GitHub Release too, and to the Chrome
# Web Store and Mozilla Add-ons when a stable release changes its version.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.branch.outputs.latest }}
      beta: ${{ steps.branch.outputs.beta }}
      clipper: ${{ steps.clipper.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Every package carries the version, and it is the tag's.
      - id: version
        run: |
          version=$(node scripts/version.ts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but the source says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Every release in this history has its notes, this one too, dated the
      # day its tag was made. Publishing uses them.
      - run: node scripts/changelog.ts --tags
      # Only reviewed commits: main's, or a release/ branch's for a fix to
      # an older release. Only a stable release from main becomes `latest`.
      # Every release from main, a beta or stable, is the beta channel's
      # newest (docs/releasing.md#beta-and-stable).
      - id: branch
        run: |
          branches=$(git branch -r --contains "$GITHUB_SHA")
          if ! grep -Eq '^ *origin/(main|release/.+)$' <<< "$branches"; then
            echo "::error::$GITHUB_SHA is on neither main nor a release/ branch"
            exit 1
          fi
          latest=false
          beta=false
          if grep -Eq '^ *origin/main$' <<< "$branches"; then
            beta=true
            [[ "$GITHUB_REF_NAME" == *-* ]] || latest=true
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "beta=$beta" >> "$GITHUB_OUTPUT"
      # The browser extension's version, when this stable release changes
      # it since the stable release before: the stores take stable versions
      # alone, and each version once (docs/releasing.md#the-browser-extension).
      - id: clipper
        run: |
          version=$(jq -r .version apps/clipper/package.json)
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$GITHUB_SHA^" 2>/dev/null || true)
          before=$( [ -z "$previous" ] || git show "$previous:apps/clipper/package.json" 2>/dev/null | jq -r .version || true)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "A beta: the clipper $version goes to no store."
          elif [ -z "$before" ]; then
            echo "${previous:-No earlier release} had no clipper: its first version goes to the stores by hand."
          elif [ "$version" = "$before" ]; then
            echo "The clipper is $version, as in $previous: nothing goes to the stores."
          else
            echo "The clipper is $version, and $previous had $before: it goes to the stores."
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      # The .deb and .rpm bundle this Electron, so it must be its major's
      # newest patch, with every security fix released so far.
      - run: |
          pinned=$(jq -r .devDependencies.electron apps/desktop/package.json)
          newest=$(npm view "electron@${pinned%%.*}" version --json | jq -r 'if type == "array" then .[-1] else . end')
          if [ "$pinned" != "$newest" ]; then
            echo "::error::apps/desktop/package.json pins Electron $pinned, but $newest is out (docs/releasing.md)"
            exit 1
          fi

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      latest: ${{ needs.verify.outputs.latest == 'true' }}
      beta: ${{ needs.verify.outputs.beta == 'true' }}
    permissions:
      contents: read
      packages: write

  # The desktop app as CI built, tested and packaged it: the .deb, the .rpm,
  # an archive of what its AUR package installs, the Windows installers, and
  # the Mac app for Apple silicon and for Intel. Beside them, the CLI as a
  # binary for each system, its install scripts, its bundle for Node, the
  # licence, and checksums for every file.
  github-release:
    needs: [verify, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          # The artifact's root is apps/, the folder its paths share.
          path: apps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-package-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-app-*
          merge-multiple: true
          path: release
      # The same bytes from the same commit: fixed order, owners and times.
      - run: |
          version="${GITHUB_REF_NAME#v}"
          name="wikistow-desktop-$version"
          mkdir -p "release/$name"
          cp apps/desktop/out/app.asar LICENSE "release/$name/"
          # The web clipper's helper, which the AUR packages install beside app.asar.
          install -m 755 apps/desktop/out/clip-host/linux-amd64/wikistow-clip-host "release/$name/"
          # The beta's launcher entry and icons too: the AUR's beta package
          # installs the same archive under the beta's names.
          cp apps/desktop/packaging/wikistow-desktop apps/desktop/packaging/wikistow-desktop.desktop \
            apps/desktop/packaging/wikistow-desktop.png apps/desktop/packaging/wikistow-desktop.svg \
            apps/desktop/packaging/wikistow-desktop-beta.desktop \
            apps/desktop/packaging/wikistow-desktop-beta.png apps/desktop/packaging/wikistow-desktop-beta.svg \
            "release/$name/"
          cd release
          tar --sort=name --owner=0 --group=0 --numeric-owner --mode=u+w,go-w \
            --mtime="@$(git log -1 --format=%ct)" -cf - "$name" | gzip -n > "$name.tar.gz"
      # The browser extension's Chrome and Firefox builds, with its own
      # version (apps/clipper), and the source Mozilla Add-ons takes with
      # the Firefox one, which CI checked builds the same files. The store
      # jobs below send them from here.
      - run: |
          cp apps/clipper/dist/wikistow-clipper-*-chrome.zip apps/clipper/dist/wikistow-clipper-*-firefox.zip \
            apps/clipper/dist/wikistow-clipper-*-source.zip release/
      # The CLI as one binary per system, built by the Bun pinned here from
      # the bundle CI tested, beside its install scripts. The Linux x64 one
      # must run outside the workspace and say it is this release.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - working-directory: apps/cli
        run: scripts/binaries.sh "${GITHUB_REF_NAME#v}" ../../release
      # The bundle too, for Node.js on systems without a binary, packed the
      # same way. Unpacked away from the workspace, it runs with nothing but
      # Node and says it is this release.
      - run: |
          version="${GITHUB_REF_NAME#v}"
          name="wikistow-cli-$version"
          mkdir -p "release/$name"
          cp apps/cli/dist/wikistow.mjs LICENSE "release/$name/"
          cp LICENSE release/
          cd release
          tar --sort=name --owner=0 --group=0 --numeric-owner --mode=u+w,go-w \
            --mtime="@$(git log -1 --format=%ct)" -cf - "$name" | gzip -n > "$name.tar.gz"
          tar -xzf "$name.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/$name"
          [ "$(node wikistow.mjs --version)" = "wikistow $version" ]
          node wikistow.mjs --help >/dev/null
      - working-directory: release
        run: |
          sha256sum wikistow-desktop-*.tar.gz wikistow-desktop-*.deb wikistow-desktop-*.rpm \
            wikistow-desktop-*-setup.exe wikistow-desktop-*-macos-arm64.zip wikistow-desktop-*-macos-x64.zip \
            wikistow-linux-* wikistow-darwin-* wikistow-windows-* install.sh install.ps1 \
            wikistow-cli-*.tar.gz wikistow-clipper-*.zip LICENSE > SHA256SUMS
          cat SHA256SUMS
      # The notes are the release's entry in CHANGELOG.md, reviewed in its
      # version change. Without one, nothing is published.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # GitHub would otherwise make any stable release its latest, even
          # a fix to an older one.
          LATEST: ${{ needs.verify.outputs.latest }}
        run: |
          node scripts/changelog.ts notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" \
            --title "WikiStow ${GITHUB_REF_NAME#v}" "${prerelease[@]}" --latest="$LATEST" \
            release/*.tar.gz release/*.deb release/*.rpm release/*-setup.exe release/*.zip \
            release/wikistow-linux-* release/wikistow-darwin-* \
            release/wikistow-windows-* release/install.sh release/install.ps1 release/LICENSE release/SHA256SUMS

  # The AUR packages follow the newest stable release, once their downloads
  # are downloadable. A prerelease or a fix to an older line leaves them alone.
  aur:
    needs: [verify, github-release]
    if: needs.verify.outputs.latest == 'true'
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ needs.verify.outputs.version }}
    # The called job's environment alone leaves its secrets empty
    # (actions/runner#4453). The repository has no other secrets.
    secrets: inherit
    permissions:
      contents: read

  # The beta packages (`-beta-bin`) follow every release from main, betas
  # and stable releases alike.
  aur-beta:
    needs: [verify, github-release]
    if: needs.verify.outputs.beta == 'true'
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      channel: beta
    # As above (actions/runner#4453).
    secrets: inherit
    permissions:
      contents: read

  # The Homebrew cask follows the newest stable release too. Without the
  # tap's key, it says so and publishes nothing.
  homebrew:
    needs: [verify, github-release]
    if: needs.verify.outputs.latest == 'true'
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ needs.verify.outputs.version }}
    # As for the AUR (actions/runner#4453).
    secrets: inherit
    permissions:
      contents: read

  # The apt and dnf repositories follow the newest stable release too.
  packages:
    needs: [verify, github-release]
    if: needs.verify.outputs.latest == 'true'
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.verify.outputs.version }}
    # As for the AUR (actions/runner#4453).
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write

  # The browser extension's new version to the Chrome Web Store, for the
  # newest stable release when it changes the extension's version: uploaded
  # and submitted for review, published once approved. In the `stores`
  # environment; without its keys it warns and sends nothing, so a release
  # never fails for them (docs/releasing.md#the-browser-extension).
  chrome-web-store:
    needs: [verify, github-release]
    if: needs.verify.outputs.latest == 'true' && needs.verify.outputs.clipper != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: stores
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.clipper }}
    steps:
      - id: keys
        env:
          CHROME_SERVICE_ACCOUNT_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_KEY }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_ITEM_ID: ${{ vars.CHROME_ITEM_ID }}
        run: |
          if [ -z "$CHROME_SERVICE_ACCOUNT_KEY" ] || [ -z "$CHROME_PUBLISHER_ID" ] || [ -z "$CHROME_ITEM_ID" ]; then
            echo "::warning::The clipper $VERSION wasn't sent to the Chrome Web Store: the stores environment needs CHROME_SERVICE_ACCOUNT_KEY, CHROME_PUBLISHER_ID and CHROME_ITEM_ID (docs/releasing.md#the-browser-extension). Upload it by hand from the GitHub Release."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.keys.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.keys.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The zip the GitHub Release published, checked against its SHA256SUMS.
      - if: steps.keys.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/clipper" \
            -p "wikistow-clipper-$VERSION-chrome.zip" -p SHA256SUMS
          cd "$RUNNER_TEMP/clipper"
          grep -E "^[0-9a-f]{64}  wikistow-clipper-$VERSION-chrome\.zip$" SHA256SUMS | sha256sum -c -
      - if: steps.keys.outputs.ready == 'true'
        env:
          CHROME_SERVICE_ACCOUNT_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_KEY }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_ITEM_ID: ${{ vars.CHROME_ITEM_ID }}
        run: node apps/clipper/scripts/chrome-store.ts "$RUNNER_TEMP/clipper/wikistow-clipper-$VERSION-chrome.zip" "$VERSION"

  # The same version to Mozilla Add-ons, as a listed version with its
  # source, for Mozilla's review; it's signed and offered once it passes.
  # In the `stores` environment too, and as forgiving without its keys.
  mozilla-add-ons:
    needs: [verify, github-release]
    if: needs.verify.outputs.latest == 'true' && needs.verify.outputs.clipper != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: stores
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.clipper }}
    steps:
      - id: keys
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$AMO_API_KEY" ] || [ -z "$AMO_API_SECRET" ]; then
            echo "::warning::The clipper $VERSION wasn't submitted to Mozilla Add-ons: the stores environment needs AMO_API_KEY and AMO_API_SECRET (docs/releasing.md#the-browser-extension). Upload it by hand from the GitHub Release, with its source zip."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.keys.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.keys.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # web-ext as the lockfile pins it, and nothing but the clipper's tools.
      - if: steps.keys.outputs.ready == 'true'
        run: |
          npm install -g "$(node -p "require('./package.json').packageManager")"
          pnpm install --frozen-lockfile --filter @wikistow/clipper
      # The zips the GitHub Release published, checked against its
      # SHA256SUMS. web-ext takes the add-on unpacked, so it's unzipped; it
      # must name the published ID, or Mozilla Add-ons would make another
      # add-on of it, and this version.
      - if: steps.keys.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/clipper" \
            -p "wikistow-clipper-$VERSION-firefox.zip" -p "wikistow-clipper-$VERSION-source.zip" -p SHA256SUMS
          cd "$RUNNER_TEMP/clipper"
          grep -E "^[0-9a-f]{64}  wikistow-clipper-$VERSION-(firefox|source)\.zip$" SHA256SUMS > checked
          [ "$(wc -l < checked)" = 2 ] || { echo "::error::SHA256SUMS lacks the Firefox or source zip"; exit 1; }
          sha256sum -c checked
          unzip -q "wikistow-clipper-$VERSION-firefox.zip" -d firefox
          [ "$(jq -r .browser_specific_settings.gecko.id firefox/manifest.json)" = web-clipper@wikistow.skint007.github.io ]
          [ "$(jq -r .version firefox/manifest.json)" = "$VERSION" ]
      # Submitted without waiting for the review, which can take a day.
      - if: steps.keys.outputs.ready == 'true'
        working-directory: apps/clipper
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          ./node_modules/.bin/web-ext sign --channel listed --approval-timeout 0 \
            --source-dir "$RUNNER_TEMP/clipper/firefox" --artifacts-dir "$RUNNER_TEMP/signed" \
            --upload-source-code "$RUNNER_TEMP/clipper/wikistow-clipper-$VERSION-source.zip"

when:
  - event: pull_request
  - event: push
    branch: main

# Keep the workspace path stable instead of relying on Woodpecker's default clone path.
workspace:
  base: /woodpecker
  path: src

variables:
  # Both images are glibc, so the node_modules installed once works in every step,
  # including the native binaries Vite+ ships (Rolldown, Oxc, tsgolint).
  # node:26 no longer bundles corepack, so install pnpm at the packageManager version.
  - &node_image node:26-trixie-slim@sha256:ec7758ee051e457b468b32bde57b0879010b325bb9862718e9615225ce4aaae1
  # Keep in step with the playwright devDependency so the bundled Chromium revision matches.
  - &browser_image mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
  - &postgres_admin_url postgres://wikistow:wikistow@postgres:5432/postgres

steps:
  # No host-volume store cache: that needs the repo marked Trusted, and the
  # install is small enough not to need it yet.
  install:
    image: *node_image
    environment:
      # The workspace is its own mount, so pnpm would otherwise put its store
      # inside the checkout, where the formatter and linter would scan it. This
      # keeps it beside the checkout on the same volume, so it can still hard-link.
      npm_config_store_dir: /woodpecker/.pnpm-store
    commands:
      - npm install -g pnpm@10.34.5
      - pnpm install --frozen-lockfile

  # Format, lint, and type checks.
  check:
    image: *node_image
    depends_on: [install]
    commands:
      - ./node_modules/.bin/vp check

  test:
    image: *node_image
    depends_on: [install]
    commands:
      - ./node_modules/.bin/vp test --project client --project unit

  # Against the Postgres service; each test file clones its own database.
  # The CLI's suite builds its bundle into a directory of its own and runs it there.
  # The restore drill runs scripts/backup.sh and restore.sh, which need the
  # Postgres client at the service's major version; trixie's is 17.
  test-integration:
    image: *node_image
    depends_on: [install]
    environment:
      TEST_DATABASE_URL: *postgres_admin_url
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client-17
      - ./node_modules/.bin/vp test --project integration

  # The protocol vectors again, in real Chromium, so browser and Node must
  # agree; and the editor surfaces, mounted for real.
  test-browser:
    image: *browser_image
    depends_on: [install]
    commands:
      - ./node_modules/.bin/vp test --project client-browser --project ui-browser

  # The web build regenerates the committed route tree; it must not change.
  build:
    image: *node_image
    depends_on: [install]
    commands:
      - cp packages/ui/src/routeTree.gen.ts /tmp/routeTree.committed.ts
      - ./node_modules/.bin/vp -C apps/server pack
      - ./node_modules/.bin/vp -C apps/cli pack
      - ./node_modules/.bin/vp -C apps/web build
      - ./node_modules/.bin/vp -C apps/desktop pack
      # What the Arch package installs: the bundles and pages in one app.asar.
      - node apps/desktop/scripts/asar.ts
      - cmp packages/ui/src/routeTree.gen.ts /tmp/routeTree.committed.ts

  # Boot the exact bundles the image ships against a fresh database. They run
  # from a copy laid out like the image, outside the workspace, so a dependency
  # missing from the bundle can't be found in node_modules by accident.
  smoke:
    image: *node_image
    depends_on: [build]
    environment:
      DATABASE_URL: postgres://wikistow:wikistow@postgres:5432/wikistow
      PUBLIC_ORIGIN: http://localhost:3000
      MIGRATIONS_DIR: /tmp/app/drizzle
      BLOB_DIR: /tmp/blobs
      WEB_DIST: /tmp/app/web
      # Placeholders: the smoke test sends no mail and signs nobody in.
      BETTER_AUTH_SECRET: smoke-test-secret-that-is-longer-than-32-characters
      SMTP_URL: smtp://127.0.0.1:1
      SMTP_FROM: WikiStow <smoke@localhost>
    commands:
      - mkdir -p /tmp/app && cp -r apps/server/dist/. /tmp/app/ && cp -r packages/server/drizzle /tmp/app/drizzle && cp -r apps/web/dist /tmp/app/web
      - cd /tmp/app
      - for attempt in $(seq 1 30); do node migrate.mjs && break; [ "$attempt" -eq 30 ] && exit 1; sleep 1; done
      - node server.mjs & server_pid=$!
      - node -e "const go = async (n) => { try { const r = await fetch('http://127.0.0.1:3000/api/installation'); if (!r.ok) throw new Error(String(r.status)); console.log(await r.text()); } catch (e) { if (n === 0) throw e; await new Promise((s) => setTimeout(s, 500)); return go(n - 1); } }; go(20);"
      - node -e "fetch('http://127.0.0.1:3000/sign-in').then(async (r) => { const csp = r.headers.get('content-security-policy') ?? ''; if (!r.ok || !csp.includes(\"script-src 'self'\") || !(await r.text()).includes('/boot.js')) process.exit(1); })"
      - kill "$server_pid"
      # The CLI is one file too, and runs with nothing but Node: unenrolled,
      # it says so with its own exit status.
      - mkdir -p /tmp/cli/home && cp "$CI_WORKSPACE/apps/cli/dist/wikistow.mjs" /tmp/cli/
      - cd /tmp/cli && node wikistow.mjs --help >/dev/null
      - code=0; HOME=/tmp/cli/home node wikistow.mjs spaces list --json || code=$?; test "$code" -eq 5
      # Only the tests' own build may run a secret-tool root didn't install.
      - grep -q 'Refusing to run' wikistow.mjs && ! grep -q WIKISTOW_TEST wikistow.mjs

  # The browser tests: the built app on the real server, in Chromium.
  e2e:
    image: *browser_image
    depends_on: [build]
    environment:
      TEST_DATABASE_URL: *postgres_admin_url
      CI: 'true'
    commands:
      - cd apps/web && ./node_modules/.bin/playwright test

  # The desktop app on the same built pages, under a virtual display, with
  # GNOME Keyring as its secret store. The browser half of each sign-in runs
  # in Chromium beside it.
  e2e-desktop:
    image: *browser_image
    depends_on: [build]
    environment:
      TEST_DATABASE_URL: *postgres_admin_url
      CI: 'true'
    commands:
      - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gnome-keyring dbus-x11 >/dev/null
      - cd apps/desktop && ./e2e/with-keyring.sh xvfb-run -a -s '-screen 0 1600x1000x24' ./node_modules/.bin/playwright test

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: wikistow
      POSTGRES_PASSWORD: wikistow
      POSTGRES_DB: wikistow
